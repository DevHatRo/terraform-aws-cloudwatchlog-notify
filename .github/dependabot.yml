version: 2

# Updates are grouped: one PR per ecosystem for minor+patch, one for majors.
updates:
  # Python dependencies in the functions directory
  - package-ecosystem: "pip"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
      pip-major:
        update-types: ["major"]
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
    commit-message:
      prefix: "ci"
      include: "scope"

  # Terraform modules and providers (module root and examples)
  - package-ecosystem: "terraform"
    directories:
      - "/"
      - "/examples/complete"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        update-types: ["minor", "patch"]
      terraform-major:
        update-types: ["major"]
    commit-message:
      prefix: "deps"
      include: "scope"
